# Publica la página web (carpeta web/) en GitHub Pages cada vez que hay cambios en main:
# https://salmawebb.github.io/torrestorres/
# Si los secretos VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY no existen, la página sale en modo demo.
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Dirección completa, para que WhatsApp muestre el logo al mandar la tarjeta.
          # Cambiarla cuando la página pase al dominio propio.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Demostración con datos de ejemplo en /demo/, para enseñarla a clientes.
      # No lleva las llaves, así que nunca toca la base real.
      # Para la entrega final se borran este paso y el "mv" de abajo.
      - run: npx vite build --outDir dist-demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/demo/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demo/
      - run: mv dist-demo dist/demo
      # GitHub Pages no sabe de rutas como /tarjeta/...; con 404.html igual a index.html
      # la página abre en cualquier ruta. Las rutas de /demo/ se mandan a la demo.
      - run: |
          base="/${{ github.event.repository.name }}/"
          script="<script>(function(){var d='${base}demo';var p=location.pathname;if(p.indexOf(d+'/')===0){location.replace(d+'/?ruta='+encodeURIComponent(p.slice(d.length)+location.search+location.hash))}})()</script>"
          sed "s#<head>#<head>${script}#" dist/index.html > dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
